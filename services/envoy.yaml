# Envoy API Gateway for homeshr microservices.
#
# This is the single REST/JSON entry point for every service:
# - /v1/auth/*       -> User service gRPC (host.docker.internal:50051)
# - /v1/user/*       -> User service gRPC (host.docker.internal:50051)
# - /v1/bookings/*   -> Booking service gRPC (host.docker.internal:50052)
# - /v1/properties/* -> Booking service gRPC (host.docker.internal:50052)
#
# Portainer/Docker container setup:
# - host port 32768 -> container port 10000
# - services/envoy.yaml -> /etc/envoy/envoy.yaml
# - services/envoy.pb   -> /etc/envoy/envoy.pb
# - extra host entry: host.docker.internal:host-gateway
#
# The jwt_authn provider validates HS256 tokens with an inline JWKS "oct" key.
# Its `k` value is the base64url (no padding) encoding of JWT_SECRET.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: listener_http
    address:
      socket_address: { address: 0.0.0.0, port_value: 10000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: api_gateway
              domains: ["*"]
              routes:
              - match: { prefix: "/v1/bookings" }
                route:
                  cluster: grpc_booking
                  timeout: 60s
              - match: { prefix: "/v1/properties" }
                route:
                  cluster: grpc_booking
                  timeout: 60s
              - match: { prefix: "/" }
                route:
                  cluster: grpc_user
                  timeout: 60s
                request_headers_to_add:
                - header:
                    key: cookie
                    value: "%REQ(cookie)%"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                - header:
                    key: x-refresh-cookie
                    value: "%REQ(cookie)%"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
          http_filters:
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                homeshr_auth:
                  forward: true
                  forward_payload_header: x-jwt-payload
                  claim_to_headers:
                  - { header_name: x-user-id, claim_name: sub }
                  - { header_name: x-user-email, claim_name: email }
                  local_jwks:
                    inline_string: '{"keys":[{"kty":"oct","alg":"HS256","k":"bXlfc3VwZXJfc2VjcmV0X2tleV8xMjM0NTY3ODk"}]}'
              rules:
              - match: { prefix: "/v1/auth/" }
              - match: { prefix: "/v1/properties/" }
              - match: { prefix: "/v1/user/" }
                requires: { provider_name: homeshr_auth }
              - match: { prefix: "/v1/bookings" }
                requires: { provider_name: homeshr_auth }
          - name: envoy.filters.http.grpc_json_transcoder
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
              proto_descriptor: /etc/envoy/envoy.pb
              services:
              - user.UserService
              - booking.BookingService
              match_incoming_request_route: true
              convert_grpc_status: true
              print_options:
                add_whitespace: true
                always_print_primitive_fields: true
                preserve_proto_field_names: true
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: grpc_user
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: grpc_user
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: host.docker.internal
                port_value: 50051

  - name: grpc_booking
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: grpc_booking
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: host.docker.internal
                port_value: 50052
